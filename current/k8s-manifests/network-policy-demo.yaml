---
# Default deny all ingress traffic in pls-dont-hack-me namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pls-dont-hack-me
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Default deny all egress traffic in pls-dont-hack-me namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: pls-dont-hack-me
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# Allow DNS egress (required for most pods to function)
# This is the kind of policy that often gets added as an afterthought,
# and can be abused for DNS exfiltration
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: pls-dont-hack-me
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Pod for testing network policy enforcement and DNS exfiltration
apiVersion: v1
kind: Pod
metadata:
  name: netpol-test-pod
  namespace: pls-dont-hack-me
  labels:
    app: netpol-test
    demo: cloud-native
spec:
  containers:
  - name: netpol-tester
    image: alpine/curl:8.11.1
    command: ["/bin/sh", "-c", "--"]
    args: ["while true; do sleep 30; done;"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
